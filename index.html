<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Facet - tools that feel like toys.">
  <meta name="theme-color" content="#141313">
  <title>Facet</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --border: #2a2a2a;
      --text: #f2f0ed;
      --muted: #9a9894;
      --accent: #ff784d;
      --accent-soft: rgba(255, 120, 77, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(255,120,77,0.08), transparent 60%),
        radial-gradient(700px 400px at 85% 90%, rgba(255,120,77,0.05), transparent 55%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .wrap {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 28px;
    }
    .tag {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 {
      font-size: clamp(2.8rem, 7vw, 4.6rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      font-weight: 700;
      color: var(--text);
    }
    .sub {
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--muted);
      max-width: 38ch;
    }
    .quote {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .quote p {
      font-size: 1.05rem;
      line-height: 1.5;
      color: #ddd9d4;
    }
    .quote p i {
      color: var(--accent);
      margin-right: 6px;
      font-size: 0.95rem;
    }
    .author {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid rgba(255,120,77,0.25);
      flex: 0 0 auto;
    }
    .author-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .author-text strong {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }
    .author-text span {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      padding: 14px 22px;
      border-radius: 12px;
      background: #2d2624;
      color: #ff784d;
      border: 1px solid rgba(255,120,77,0.35);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.18s ease;
      box-shadow: inset 0 0 0 1px rgba(255,120,77,0.08);
    }
    .cta:hover {
      background: #352c29;
      border-color: rgba(255,120,77,0.5);
      color: #ff8f69;
      transform: translateY(-1px);
    }
    @media (max-width: 520px) {
      .wrap { gap: 22px; }
      .sub {
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--muted);
      max-width: 38ch;
    }
    .quote { padding: 16px 16px; border-radius: 12px; }
      .cta { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="tag">Facet</div>
    <h1>tools that<br>feel like toys.</h1>
    <p class="sub">A lightweight launcher and toolkit for Bloxd, simple, fast, and easy to pick up.</p>

    <div class="quote">
      <p><i class="fas fa-quote-left"></i>wow, this is actually good.</p>
      <div class="author">
        <div class="avatar">O</div>
        <div class="author-text">
          <strong>Oliver</strong>
          <span>Bloxd.io dev</span>
        </div>
      </div>
    </div>

    <a class="cta" href="/app/">Check it out yourself <i class="fas fa-arrow-right"></i></a>
  </main>
</body>
</html>
